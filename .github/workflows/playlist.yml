name: Generate Akash Go Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটো রান হবে
  workflow_dispatch: # ম্যানুয়ালি চালানোর জন্য
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and Execute Script from Private Repo
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # প্রাইভেট রেপো ক্লোন করা
          git clone https://${GH_PAT}@github.com/sm-monirulislam/${REPO_NAME}.git private_code
          
          # স্ক্রিপ্ট রান করা
          python private_code/scripts/akash_sm.py
          
          # প্রাইভেট কোড ডিলিট করে ক্লিন করা
          rm -rf private_code

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add akash_go.m3u

          if git diff --cached --quiet; then
            echo "No changes in playlist. Skipping commit."
          else
            git commit -m "🔁 Auto-updated Akash Go Playlist"
            git push origin HEAD
          fi
