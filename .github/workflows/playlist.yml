name: Generate Akash Go Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক রান হবে
  workflow_dispatch: # ম্যানুয়ালি বোতাম চেপে চালানোর সুবিধা

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Akash Playlist Script
        run: python scripts/akash_sm.py

      - name: Commit and Push Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add akash_go.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔁 Auto-updated Akash Go Playlist"
            git push origin HEAD
          fi
